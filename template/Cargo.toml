[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"
description = "{{description}}"
authors = ["{{author}}"]
license = "MIT"
publish = false

[[bin]]
name = "{{bin_name}}"
path = "src/main.rs"

[features]
default = ["repl", "tui"]
repl = ["doctor-kit/repl"]
tui = ["doctor-kit/tui"]

[dependencies]
doctor-kit = "0.1"
doctor-core = "0.1"

[dev-dependencies]
serde_json = "1"
